name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --tb=short

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv pip-audit
      - name: Verify lockfile is in sync with pyproject.toml
        run: uv lock --check
      - name: Export locked dependencies
        run: >
          uv export --frozen --no-hashes --no-emit-project --all-extras
          --format requirements-txt
          --output-file "$RUNNER_TEMP/requirements-audit.txt"
      - name: Audit dependencies for known vulnerabilities
        run: >
          pip-audit --requirement "$RUNNER_TEMP/requirements-audit.txt"
          --no-deps --disable-pip --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ipi-check .
      - run: docker run ipi-check --version
